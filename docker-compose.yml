services:
  db:
    image: postgres:16-alpine
    container_name: qlikcollab-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: qlik_collaboration
      POSTGRES_USER: ${POSTGRES_USER:-qlik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-qlik} -d qlik_collaboration"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: backend/QlikCollaboration.Api/Dockerfile
    image: qlik-collaboration-api:latest
    container_name: qlikcollab-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=qlik_collaboration;Username=${POSTGRES_USER:-qlik};Password=${POSTGRES_PASSWORD}"
      Cors__AllowedOrigins__0: ${QLIK_ORIGIN:-*}
      Qlik__BaseUrl: ${QLIK_BASE_URL:-}
      Database__ApplySchemaOnStart: ${DB_APPLY_SCHEMA:-false}
      Swagger__Enabled: "${SWAGGER_ENABLED:-true}"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5000"
      Storage__AttachmentsPath: "/data/uploads"
      DOTNET_SYSTEM_GLOBALIZATION_PREDEFINED_CULTURES_ONLY: "false"
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads: