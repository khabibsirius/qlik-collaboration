<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Qlik Collaboration — team inbox</title>
<style>
  /* ----------------------------------------------------------------------
     Tokens. Surfaces, ink and gridlines from the validated reference
     palette; Qlik green stays as the brand accent so this panel and the
     extension read as one product.

     Status colours are the reserved status palette, and are the same in
     both modes by design. The mapping avoids putting `serious` next to
     `warning`: those two measure normal-vision dE 13.6, under the 15 floor,
     which no amount of labelling excuses. `new` therefore takes the
     categorical blue instead, and the four segment colours that do end up
     side by side clear both separation gates in both modes (CVD dE 10.7,
     normal-vision 20.2).
     ------------------------------------------------------------------- */
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --card: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --hair: rgba(11, 11, 11, .10);
    --brand: #009845;
    --brand-ink: #007d39;

    --s-new: #2a78d6;
    --s-progress: #fab219;
    --s-fixed: #0ca30c;
    --s-closed: #898781;
    --s-critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --card: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --hair: rgba(255, 255, 255, .10);
      --brand: #12b055;
      --brand-ink: #35c46f;
      --s-new: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --card: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --hair: rgba(255, 255, 255, .10);
    --brand: #12b055;
    --brand-ink: #35c46f;
    --s-new: #3987e5;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* Two columns: the queue is the work, so it takes the room, and the roles screen
     lives beside it instead of pushing it down the page. On a wide monitor the old
     centred 1160px column left most of the screen empty. */
  .wrap {
    max-width: 1720px; margin: 0 auto; padding: 0 20px 64px;
    display: grid; grid-template-columns: 330px minmax(0, 1fr);
    gap: 0 26px; align-items: start;
  }
  .side { position: sticky; top: 104px; }      /* clears the two-row header */
  .main { min-width: 0; }                       /* lets the queue shrink, not overflow */

  /* Hidden: the queue takes the whole width and the way back is in the header. */
  .wrap.no-side { grid-template-columns: minmax(0, 1fr); }
  .wrap.no-side .side { display: none; }

  /* Narrow screens have no room for a second column; stack and stop sticking. */
  @media (max-width: 1150px) {
    .wrap { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; }
  }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--card);
    border-bottom: 1px solid var(--hair);
  }
  /* Two rows on purpose. One row could not hold the title, six pills, three
     dropdowns and the status without wrapping, and a wrapped flex row puts the
     connection state on a line of its own looking orphaned. */
  /* Same width as .wrap below, or the title sits inset from the content it heads
     and the two look like separate pages on a wide monitor. */
  .head-in {
    max-width: 1720px; margin: 0 auto; padding: 10px 20px 0;
    display: flex; align-items: center; gap: 14px;
  }
  .head-filters { padding: 9px 20px 10px; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .1px; }
  h1 b { color: var(--muted); font-weight: 400; }
  .spacer { flex: 1; }

  .conn { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .conn::before { content: "● "; color: var(--muted); }
  .conn.live::before { color: var(--s-fixed); }
  .conn.down::before { color: var(--s-critical); }

  .icon-btn {
    border: 1px solid var(--hair); background: var(--card); color: var(--ink-2);
    border-radius: 7px; width: 30px; height: 26px; cursor: pointer;
    font-size: 13px; line-height: 1;
  }
  .icon-btn:hover { border-color: var(--brand); color: var(--brand-ink); }
  /* .icon-btn is a fixed 30px box built for a single glyph. This one carries a word,
     which overflowed it and ran into the connection status beside it. */
  .text-btn {
    width: auto; padding: 0 11px; font-size: 12px; white-space: nowrap;
    border-radius: 20px; flex: none;
  }

  /* ---------- filters: one row, above everything they affect ---------- */
  .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .filters button {
    border: 1px solid var(--hair); background: var(--card); color: var(--ink-2);
    border-radius: 20px; padding: 4px 12px; font: inherit; font-size: 12.5px;
    cursor: pointer;
  }
  .filters button:hover { border-color: var(--brand); }
  .filters button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  /* ---------- searchable dropdown ----------
     A native <select> is fine for five options and unusable for a hundred: no
     typing, no filtering, just a long scroll. This is a button plus a popover
     with a search box, which is the same interaction people already know from
     every other picker. */
  .combo { position: relative; }
  .combo-btn {
    display: flex; align-items: center; gap: 6px; max-width: 230px;
    border: 1px solid var(--hair); background: var(--card); color: var(--ink-2);
    border-radius: 20px; padding: 4px 10px; font: inherit; font-size: 12.5px;
    cursor: pointer;
  }
  .combo-btn:hover { border-color: var(--brand); }
  .combo-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .combo-caret { color: var(--muted); font-size: 9px; flex: none; }
  /* An active filter has to look active, or a narrowed list reads as
     "the comments are gone". */
  .combo.on .combo-btn { border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }

  .combo-pop {
    position: absolute; z-index: 40; top: calc(100% + 5px); left: 0; width: 268px;
    background: var(--card); border: 1px solid var(--hair); border-radius: 10px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .18); padding: 7px;
  }
  .combo-pop[hidden] { display: none; }
  .combo-search {
    width: 100%; border: 1px solid var(--hair); border-radius: 7px;
    background: var(--page); color: var(--ink);
    padding: 5px 9px; font: inherit; font-size: 12.5px; margin-bottom: 5px;
  }
  .combo-search:focus { outline: none; border-color: var(--brand); }
  .combo-list { max-height: 260px; overflow-y: auto; }
  .combo-opt {
    padding: 5px 9px; border-radius: 6px; font-size: 12.5px; color: var(--ink-2);
    cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .combo-opt:hover, .combo-opt.active { background: var(--page); color: var(--ink); }
  .combo-opt.sel { color: var(--brand-ink); font-weight: 600; }
  .combo-opt b { background: rgba(0, 152, 69, .18); font-weight: 700; border-radius: 2px; }
  .combo-note { padding: 6px 9px; font-size: 11.5px; color: var(--muted); }
  #fClear {
    border: 0; background: none; color: var(--muted); padding: 2px 4px;
    font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline;
  }
  #fClear:hover { color: var(--s-critical); }

  /* ---------- overview ---------- */
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 9px;
  }
  .kpis { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 10px; }
  @media (max-width: 780px) { .kpis { grid-template-columns: 1fr 1fr; } }

  .tile {
    background: var(--card); border: 1px solid var(--hair); border-radius: 10px;
    padding: 12px 14px; text-align: left; font: inherit; color: inherit;
    cursor: pointer; position: relative; overflow: hidden;
  }
  .tile:hover { border-color: var(--brand); }
  .tile.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  /* the state each tile stands for, as a bar down its left edge */
  .tile::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--tile-accent, transparent);
  }
  .tile-label { font-size: 12px; color: var(--ink-2); }
  /* Proportional figures: tabular-nums makes a big standalone number look loose. */
  .tile-value { font-size: 26px; font-weight: 600; line-height: 1.15; margin-top: 2px; }
  .tile-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

  /* the one hero figure on the page */
  .tile.hero .tile-value { font-size: 48px; font-weight: 600; letter-spacing: -1px; }
  .tile.hero .tile-sub { font-size: 12px; }

  /* ---------- breakdown ---------- */
  .panel {
    background: var(--card); border: 1px solid var(--hair); border-radius: 10px;
    padding: 14px 16px;
  }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  /* max-content lets short dashboard names hug their bars instead of leaving a
     column of dead space; the cap stops a long .qvf path from squeezing the plot. */
  .bars { display: grid; grid-template-columns: minmax(0, max-content) 1fr auto; gap: 7px 12px; align-items: center; }
  .bar-name {
    font-size: 12.5px; max-width: 230px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bar-name em { color: var(--muted); font-style: normal; }
  .bars-note { margin-top: 9px; font-size: 12px; color: var(--muted); }

  /* ---------- people & roles ----------
     A row per person rather than a five-column table: the sidebar is 330px and a
     table with Threads / Replies / Last wrote columns simply does not fit in it. */
  .person {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 0; border-top: 1px solid var(--hair);
  }
  .person:first-of-type { border-top: 0; }
  .person-main { flex: 1; min-width: 0; }
  .person-name {
    font-weight: 600; font-size: 12.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .person-sub { font-size: 11px; color: var(--muted); }
  .role-pick {
    flex: none;
    border: 1px solid var(--hair); background: var(--card); color: var(--ink-2);
    border-radius: 20px; padding: 3px 6px; font: inherit; font-size: 11.5px; cursor: pointer;
  }
  .role-pick:disabled { cursor: default; opacity: .6; }
  .role-admin { border-color: var(--s-critical); color: var(--s-critical); font-weight: 600; }
  .role-team  { border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
  .who-am-i { margin-bottom: 10px; font-size: 12px; color: var(--muted); }
  .who-am-i input {
    display: block; width: 100%; margin-top: 4px;
    border: 1px solid var(--hair); background: var(--card); color: var(--ink);
    border-radius: 7px; padding: 5px 9px; font: inherit; font-size: 12.5px;
  }
  .who-am-i input:focus { outline: none; border-color: var(--brand); }
  .who-am-i b { color: var(--ink-2); }
  .note {
    margin-top: 10px; font-size: 11.5px; color: var(--muted);
    border-top: 1px solid var(--hair); padding-top: 9px;
  }
  /* Track carries no fill of its own; the surface between segments is the 2px gap. */
  .bar-track { height: 14px; display: flex; gap: 2px; }
  .bar-seg { min-width: 3px; }
  .bar-seg:last-child { border-radius: 0 4px 4px 0; }   /* rounded data-end, square baseline */
  .bar-total { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  #tip {
    position: fixed; z-index: 60; pointer-events: none; display: none;
    background: var(--ink); color: var(--page);
    border-radius: 6px; padding: 5px 8px; font-size: 11.5px; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }

  /* ---------- thread list ---------- */
  .group-head {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: 20px 0 8px; font-size: 13px; font-weight: 600;
    cursor: pointer; user-select: none;
  }
  .group-head .sheet { color: var(--muted); font-weight: 400; }
  .grp-caret {
    flex: none; width: 15px; color: var(--muted); font-size: 10px;
    transition: transform .12s;
  }
  .group-head.collapsed .grp-caret { transform: rotate(-90deg); }
  /* what is hidden, so a collapsed group is never mistaken for an empty one */
  .grp-count {
    font-weight: 400; font-size: 11.5px; color: var(--muted);
    border: 1px solid var(--hair); border-radius: 20px; padding: 0 7px;
  }
  .group-head.collapsed .grp-count { color: var(--ink-2); border-color: var(--muted); }
  .queue-head { display: flex; align-items: center; gap: 10px; }
  .queue-head button {
    border: 0; background: none; color: var(--muted); font: inherit; font-size: 11px;
    letter-spacing: .3px; cursor: pointer; text-transform: none; text-decoration: underline;
  }
  .queue-head button:hover { color: var(--brand-ink); }
  .group-head a { color: var(--brand-ink); text-decoration: none; font-weight: 400; font-size: 12px; }
  .group-head a:hover { text-decoration: underline; }

  .item {
    background: var(--card); border: 1px solid var(--hair);
    border-left: 3px solid transparent; border-radius: 8px;
    padding: 10px 13px; margin-bottom: 8px;
  }
  .item.unanswered { border-left-color: var(--s-critical); }

  .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
  .who { font-weight: 600; font-size: 13px; }
  .when { color: var(--muted); font-size: 12px; }
  .body { white-space: pre-wrap; word-break: break-word; margin-bottom: 7px; }

  .chip {
    border: 0; border-radius: 20px; padding: 2px 9px; font: inherit;
    font-size: 10.5px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
    cursor: pointer; color: #fff;
  }
  .chip.s-new      { background: var(--s-new); }
  .chip.s-progress { background: var(--s-progress); color: #3a2a00; }
  .chip.s-fixed    { background: var(--s-fixed); }
  .chip.s-closed   { background: var(--s-closed); }
  .chip:hover { filter: brightness(.94); }

  .tag { font-size: 11.5px; color: var(--muted); }
  /* the signal the queue exists for — never colour alone, always the words too */
  .tag.waiting { color: var(--s-critical); font-weight: 600; }

  .actions { display: flex; gap: 12px; align-items: center; }
  .actions a, .actions button.link {
    color: var(--muted); font-size: 12px; text-decoration: none; background: none;
    border: 0; padding: 0; cursor: pointer; font: inherit; font-size: 12px;
  }
  .actions a:hover, .actions button.link:hover { color: var(--ink); text-decoration: underline; }
  .actions .open { color: var(--brand-ink); font-weight: 500; }
  .actions .danger:hover { color: var(--s-critical); }
  /* armed: the next click really deletes */
  .actions .danger.armed { color: var(--s-critical); font-weight: 700; }

  .replies { margin: 8px 0 0; padding-left: 12px; border-left: 2px solid var(--grid); }
  .reply { padding: 4px 0; font-size: 13px; }

  .empty { text-align: center; color: var(--muted); padding: 54px 20px; }
  .empty strong { display: block; font-size: 16px; color: var(--ink-2); margin-bottom: 6px; }
  .error {
    background: #fdecec; border: 1px solid #f5c2c2; color: #a32020;
    border-radius: 8px; padding: 10px 12px; margin: 14px 0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .error { background: #2a1414; border-color: #5b2626; color: #f0a9a9; }
  }
</style>
</head>
<body>

<header>
  <div class="head-in">
    <h1>Team inbox <b id="count"></b></h1>
    <div class="spacer"></div>
    <button class="icon-btn text-btn" id="showSide" title="Show people and access" style="display:none">People</button>
    <div class="conn" id="conn">connecting…</div>
    <button class="icon-btn" id="theme" title="Light / dark">◐</button>
  </div>
  <div class="head-in head-filters">
    <div class="filters" id="filters">
      <button data-f="all" class="on">All open</button>
      <button data-f="unanswered">Needs a reply</button>
      <button data-f="new">New</button>
      <button data-f="in_progress">In progress</button>
      <button data-f="fixed">Fixed</button>
      <button data-f="closed">Include closed</button>
      <div class="combo" id="cUser"></div>
      <div class="combo" id="cApp"></div>
      <div class="combo" id="cSheet"></div>
      <button id="fClear" style="display:none">clear</button>
    </div>
  </div>
</header>

<div class="wrap" id="wrap">
  <aside class="side" id="side">
    <div class="section-label queue-head">
      <span>People and access</span>
      <button id="collapseSide" type="button">hide</button>
    </div>
    <div class="panel" id="people"></div>
  </aside>

  <main class="main">
    <div id="err" class="error" style="display:none"></div>

    <div class="section-label">Where things stand</div>
    <div class="kpis" id="kpis"></div>

    <div class="section-label">Open feedback by dashboard</div>
    <div class="panel" id="breakdown"></div>

    <div class="section-label queue-head">
      <span>The queue</span>
      <button id="collapseAll" type="button">collapse all</button>
    </div>
    <div id="list"></div>
  </main>
</div>

<div id="tip"></div>

<script src="/signalr.min.js"></script>
<script>
(function () {
  "use strict";

  var STATUS = [
    { key: "new",         label: "New",         cls: "s-new",      color: "--s-new" },
    { key: "in_progress", label: "In progress", cls: "s-progress", color: "--s-progress" },
    { key: "fixed",       label: "Fixed",       cls: "s-fixed",    color: "--s-fixed" },
    { key: "closed",      label: "Closed",      cls: "s-closed",   color: "--s-closed" }
  ];
  var STATUS_BY = {};
  STATUS.forEach(function (s) { STATUS_BY[s.key] = s; });
  var ORDER = STATUS.map(function (s) { return s.key; });

  var qlikBaseUrl = "";
  var filter = "all";
  var fUser = "", fApp = "", fSheet = "";
  var items = [];
  var expanded = {};
  var lastPayload = "";

  var $ = function (id) { return document.getElementById(id); };
  var $list = $("list"), $count = $("count"), $conn = $("conn"), $err = $("err");
  var $kpis = $("kpis"), $breakdown = $("breakdown"), $tip = $("tip");
  var $fClear = $("fClear");
  // group key -> true when its threads are folded away; remembered per person
  var collapsed = {};
  try { collapsed = JSON.parse(localStorage.getItem("qlikCollab.collapsed") || "{}") || {}; }
  catch (e) { collapsed = {}; }
  function saveCollapsed() {
    try { localStorage.setItem("qlikCollab.collapsed", JSON.stringify(collapsed)); }
    catch (e) { /* private mode - it just will not be remembered */ }
  }

  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  // ---- time ---------------------------------------------------------------
  // Guarded at both ends: a row stamped by the backend can sit ahead of this
  // machine's clock (different timezone, or a clock set back), and unguarded
  // "days ago" arithmetic prints things like "-12 days ago".
  function startOfDay(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function daysSince(iso) {
    return Math.round((startOfDay(new Date()) - startOfDay(new Date(iso))) / 86400000);
  }
  function fmtTime(iso) {
    var d = new Date(iso);
    var hm = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    var days = daysSince(iso);
    if (days === 0) return "today " + hm;
    if (days === 1) return "yesterday " + hm;
    if (days > 1 && days < 7) return days + " days ago";
    return d.toLocaleDateString() + " " + hm;
  }
  function waitedLabel(iso) {
    var days = daysSince(iso);
    if (days <= 0) return "waiting";                 // today, or clock skew
    return "waiting " + days + (days === 1 ? " day" : " days");
  }

  function qlikUrl(it) {
    if (!qlikBaseUrl) return null;
    return qlikBaseUrl + "/sense/app/" + encodeURIComponent(it.appId) +
           "/sheet/" + encodeURIComponent(it.sheetId) + "/state/analysis";
  }
  function appLabel(it) { return it.appName || it.appId; }
  function sheetLabel(it) { return it.sheetName || it.sheetId; }
  function sheetKey(it) { return it.appId + "|" + it.sheetId; }
  function isWaiting(it) { return it.replyCount === 0 && it.status !== "closed"; }

  function showError(msg) { $err.textContent = msg; $err.style.display = ""; }
  function clearError() { $err.style.display = "none"; }

  // ---- filtering ----------------------------------------------------------
  // The dropdowns scope the whole view. The status pills then drill into that
  // scope, which is why the tiles and the chart are computed before the pill is
  // applied: they are the thing the pill is a drill-down of.
  function inScope(it) {
    if (fUser && it.author !== fUser) return false;
    if (fApp && it.appId !== fApp) return false;
    if (fSheet && sheetKey(it) !== fSheet) return false;
    return true;
  }
  function matchesStatus(it) {
    if (filter === "all") return it.status !== "closed";
    if (filter === "closed") return true;
    if (filter === "unanswered") return isWaiting(it);
    return it.status === filter;
  }

  // ---- dropdowns ----------------------------------------------------------
  function distinct(list, keyOf, nameOf, fallbackOf) {
    var byKey = {}, out = [];
    list.forEach(function (it) {
      var k = keyOf(it);
      if (!k) return;
      var name = nameOf(it);
      if (!byKey[k]) { byKey[k] = { value: k, label: name || fallbackOf(it), named: !!name }; out.push(byKey[k]); }
      else if (!byKey[k].named && name) { byKey[k].label = name; byKey[k].named = true; }
    });
    return out.sort(function (a, b) { return a.label.localeCompare(b.label); });
  }
  // A native <select> is fine for five options and unusable for a hundred: no
  // typing, no filtering, just a long scroll. Same contract as the select it
  // replaces — setOptions returns the value that survived, so a choice whose data
  // has gone falls back to "all" instead of filtering against something absent.
  var openCombo = null;
  var MAX_ROWS = 300;               // a hundred is fine; ten thousand must not render

  function Combo(id, allLabel, onPick) {
    var root = $(id);
    root.innerHTML =
      '<button class="combo-btn" type="button" aria-haspopup="listbox" aria-expanded="false">' +
        '<span class="combo-label"></span><span class="combo-caret">▼</span></button>' +
      '<div class="combo-pop" hidden>' +
        '<input class="combo-search" type="text" placeholder="Search…" autocomplete="off" spellcheck="false"/>' +
        '<div class="combo-list" role="listbox"></div></div>';

    var btn = root.querySelector(".combo-btn"),
        lab = root.querySelector(".combo-label"),
        pop = root.querySelector(".combo-pop"),
        search = root.querySelector(".combo-search"),
        list = root.querySelector(".combo-list");
    var options = [], value = "", shown = [], active = -1;

    function allText() { return allLabel + " (" + options.length + ")"; }
    function paint() {
      var hit = null;
      options.forEach(function (o) { if (o.value === value) hit = o; });
      lab.textContent = hit ? hit.label : allText();
      btn.title = lab.textContent;
      root.classList.toggle("on", !!value);
    }
    function mark(label, q) {
      var i = q ? label.toLowerCase().indexOf(q) : -1;
      if (i === -1) return esc(label);
      return esc(label.slice(0, i)) + "<b>" + esc(label.slice(i, i + q.length)) + "</b>" +
             esc(label.slice(i + q.length));
    }
    function renderList() {
      var q = search.value.trim().toLowerCase();
      shown = q ? options.filter(function (o) { return o.label.toLowerCase().indexOf(q) !== -1; }) : options;
      var html = '<div class="combo-opt' + (value ? "" : " sel") + '" data-v="" role="option">' +
                 esc(allText()) + "</div>";
      html += shown.slice(0, MAX_ROWS).map(function (o, i) {
        return '<div class="combo-opt' + (o.value === value ? " sel" : "") +
               (i === active ? " active" : "") + '" data-v="' + esc(o.value) +
               '" role="option" title="' + esc(o.label) + '">' + mark(o.label, q) + "</div>";
      }).join("");
      if (!shown.length) html += '<div class="combo-note">Nothing matches “' + esc(search.value.trim()) + "”</div>";
      else if (shown.length > MAX_ROWS)
        html += '<div class="combo-note">' + (shown.length - MAX_ROWS) + " more — keep typing to narrow</div>";
      list.innerHTML = html;
      var act = list.querySelector(".combo-opt.active");
      if (act) act.scrollIntoView({ block: "nearest" });
    }
    function open() {
      if (openCombo) openCombo();          // only one popover at a time
      openCombo = close;
      pop.hidden = false;
      btn.setAttribute("aria-expanded", "true");
      search.value = ""; active = -1;
      renderList();
      search.focus();
    }
    function close() {
      pop.hidden = true;
      btn.setAttribute("aria-expanded", "false");
      if (openCombo === close) openCombo = null;
    }
    function pick(v) { value = v; paint(); close(); onPick(); }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (pop.hidden) open(); else close();
    });
    root.addEventListener("click", function (e) { e.stopPropagation(); });
    search.addEventListener("input", function () { active = -1; renderList(); });
    search.addEventListener("keydown", function (e) {
      var n = Math.min(shown.length, MAX_ROWS);
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        if (!n) return;
        active = e.key === "ArrowDown" ? (active + 1) % n : (active <= 0 ? n - 1 : active - 1);
        renderList();
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (active >= 0 && shown[active]) pick(shown[active].value);
        else if (n === 1) pick(shown[0].value);        // one match left: just take it
      } else if (e.key === "Escape") {
        e.preventDefault(); close(); btn.focus();
      }
    });
    list.addEventListener("click", function (e) {
      var opt = e.target.closest(".combo-opt");
      if (opt) pick(opt.getAttribute("data-v"));
    });

    return {
      setOptions: function (opts, current) {
        options = opts;
        value = (current && opts.some(function (o) { return o.value === current; })) ? current : "";
        paint();
        if (!pop.hidden) renderList();
        return value;
      },
      get value() { return value; },
      clear: function () { value = ""; paint(); }
    };
  }
  document.addEventListener("click", function () { if (openCombo) openCombo(); });

  function syncFilters() {
    fUser = cUser.setOptions(
      distinct(items, function (i) { return i.author; },
                      function (i) { return i.author; },
                      function (i) { return i.author; }), fUser);
    fApp = cApp.setOptions(
      distinct(items, function (i) { return i.appId; },
                      function (i) { return i.appName; },
                      function (i) { return i.appId; }), fApp);
    var forSheets = fApp ? items.filter(function (i) { return i.appId === fApp; }) : items;
    fSheet = cSheet.setOptions(
      distinct(forSheets, sheetKey,
        function (i) { return i.sheetName ? (fApp ? i.sheetName : appLabel(i) + " › " + i.sheetName) : ""; },
        function (i) { return fApp ? i.sheetId : appLabel(i) + " › " + i.sheetId; }), fSheet);
    $fClear.style.display = (fUser || fApp || fSheet) ? "" : "none";
  }

  // ---- the numbers --------------------------------------------------------
  function renderKpis(scoped) {
    var waiting = scoped.filter(isWaiting);
    var oldest = waiting.reduce(function (acc, it) {
      var d = daysSince(it.createdAt);
      return d > acc ? d : acc;
    }, 0);
    var counts = {};
    scoped.forEach(function (it) { counts[it.status] = (counts[it.status] || 0) + 1; });

    function tile(cls, f, accent, label, value, sub) {
      return '<button class="tile' + (cls ? " " + cls : "") + (filter === f ? " on" : "") + '"' +
             ' data-f="' + f + '" style="--tile-accent:' + accent + '">' +
             '<div class="tile-label">' + esc(label) + "</div>" +
             '<div class="tile-value">' + value + "</div>" +
             '<div class="tile-sub">' + esc(sub) + "</div></button>";
    }

    // Age is the useful subline when there is an age to report. When every waiting
    // thread dates from today — or from ahead of this clock — say something the data
    // actually supports instead of asserting "all from today" off a skewed clock.
    var boards = {};
    waiting.forEach(function (it) { boards[it.appId] = true; });
    var boardCount = Object.keys(boards).length;
    var sub = waiting.length === 0
      ? "everything has an answer"
      : oldest > 0
        ? "oldest has waited " + oldest + (oldest === 1 ? " day" : " days")
        : "across " + boardCount + (boardCount === 1 ? " dashboard" : " dashboards");

    $kpis.innerHTML =
      tile("hero", "unanswered", "var(--s-critical)", "Needs a reply", waiting.length, sub) +
      tile("", "new", "var(--s-new)", "New", counts["new"] || 0, "not picked up yet") +
      tile("", "in_progress", "var(--s-progress)", "In progress", counts.in_progress || 0, "being worked on") +
      tile("", "fixed", "var(--s-fixed)", "Fixed", counts.fixed || 0, "awaiting close");
  }

  // Horizontal stacked bars: length compares dashboards, composition shows the
  // mix. Segments are separated by a 2px gap in the surface colour rather than a
  // stroke, and only the data-end is rounded.
  function renderBreakdown(scoped) {
    if (!scoped.length) {
      $breakdown.innerHTML = '<div class="tag">Nothing in scope to summarise.</div>';
      return;
    }
    var groups = {}, order = [];
    scoped.forEach(function (it) {
      var k = it.appId;
      if (!groups[k]) { groups[k] = { label: appLabel(it), named: !!it.appName, total: 0, by: {}, sheets: {} }; order.push(k); }
      var g = groups[k];
      if (!g.named && it.appName) { g.label = it.appName; g.named = true; }
      g.total++;
      g.by[it.status] = (g.by[it.status] || 0) + 1;
      g.sheets[it.sheetId] = true;
    });

    order.sort(function (a, b) { return groups[b].total - groups[a].total; });

    // The question is "which dashboard is piling up", and past a handful of rows
    // that answer is buried in a wall of near-identical bars that also pushes the
    // queue off the screen. Show the leaders and account for the rest in a note.
    //
    // The remainder is deliberately NOT a bar. It is an aggregate of many
    // dashboards, so its length is not comparable with a single one's - drawn as a
    // bar it was both longer than the scale allowed (it overflowed the panel) and
    // an invitation to read "Other" as the busiest dashboard.
    var TOP = 8, tail = order.slice(TOP), tailTotal = 0;
    if (tail.length > 1) {
      tail.forEach(function (k) { tailTotal += groups[k].total; });
      order = order.slice(0, TOP);
    } else {
      tail = [];
    }
    var max = order.reduce(function (m, k) { return Math.max(m, groups[k].total); }, 0) || 1;

    // Only the states actually on screen. A legend entry with no segment behind it
    // reads as "there is some Closed work somewhere" when the scope holds none.
    var present = {};
    scoped.forEach(function (it) { present[it.status] = true; });
    var legend = '<div class="legend">' + STATUS.filter(function (s) { return present[s.key]; })
      .map(function (s) {
        return "<span><i style='background:var(" + s.color + ")'></i>" + esc(s.label) + "</span>";
      }).join("") + "</div>";

    var rows = order.map(function (k) {
      var g = groups[k];
      var segs = STATUS.filter(function (s) { return g.by[s.key]; }).map(function (s) {
        var n = g.by[s.key];
        return '<div class="bar-seg" style="flex:' + n + ';background:var(' + s.color + ')"' +
               ' data-tip="' + esc(g.label + " · " + s.label + ": " + n +
                                  (n === 1 ? " thread" : " threads")) + '"></div>';
      }).join("");
      var sheetCount = Object.keys(g.sheets).length;
      return '<div class="bar-name" title="' + esc(g.label) + '">' + esc(g.label) +
               " <em>· " + sheetCount + (sheetCount === 1 ? " sheet" : " sheets") + "</em></div>" +
             '<div class="bar-track" style="width:' + (g.total / max * 100).toFixed(1) + '%">' + segs + "</div>" +
             '<div class="bar-total">' + g.total + "</div>";
    }).join("");

    var note = tail.length
      ? '<div class="bars-note">and ' + tail.length + " more dashboards holding " + tailTotal +
        (tailTotal === 1 ? " thread" : " threads") + " between them</div>"
      : "";
    $breakdown.innerHTML = legend + '<div class="bars">' + rows + "</div>" + note;
  }

  // ---- the list -----------------------------------------------------------
  function one(it) {
    var url = qlikUrl(it);
    var st = STATUS_BY[it.status] || STATUS_BY["new"];
    var waiting = isWaiting(it);
    var isOpen = Object.prototype.hasOwnProperty.call(expanded, it.id);

    return '<div class="item' + (waiting ? " unanswered" : "") + '">' +
      '<div class="meta">' +
        '<span class="who">' + esc(it.author) + "</span>" +
        '<span class="when">' + esc(fmtTime(it.createdAt)) + "</span>" +
        '<button class="chip ' + st.cls + '" data-id="' + it.id + '" data-status="' + esc(it.status) +
          '" title="Click to move it along">' + esc(st.label) + "</button>" +
        (waiting
          ? '<span class="tag waiting">' + esc(waitedLabel(it.createdAt)) + "</span>"
          : '<span class="tag">' + it.replyCount + (it.replyCount === 1 ? " reply" : " replies") + "</span>") +
      "</div>" +
      '<div class="body">' + esc(it.body) + "</div>" +
      '<div class="actions">' +
        (url ? '<a class="open" href="' + esc(url) + '" target="_blank" rel="noopener">open the sheet ↗</a>' : "") +
        (it.replyCount > 0
          ? '<button class="link" data-toggle="' + it.id + '">' + (isOpen ? "hide replies" : "show replies") + "</button>"
          : "") +
        // Deleting someone else's comment is the admin's job and nobody else's, so the
        // action only exists for them. The API enforces the same rule independently.
        (myRole() === "admin"
          ? '<button class="link danger" data-del="' + it.id + '">delete</button>'
          : "") +
      "</div>" +
      (isOpen ? '<div class="replies">' + (expanded[it.id].length
        ? expanded[it.id].map(function (r) {
            return '<div class="reply"><span class="who">' + esc(r.author) + "</span> " +
                   '<span class="when">' + esc(fmtTime(r.createdAt)) + "</span><br/>" + esc(r.body) + "</div>";
          }).join("")
        : '<div class="reply when">No replies.</div>') + "</div>" : "") +
      "</div>";
  }

  function render() {
    syncFilters();
    var scoped = items.filter(inScope);
    renderKpis(scoped);
    renderBreakdown(scoped);

    var shown = scoped.filter(matchesStatus);
    $count.textContent = "(" + shown.length + ")";

    if (!shown.length) {
      var narrowed = [];
      if (fUser) narrowed.push("person");
      if (fApp) narrowed.push("app");
      if (fSheet) narrowed.push("sheet");
      $list.innerHTML = '<div class="empty"><strong>Nothing here</strong>' +
        (narrowed.length
          ? "No threads match the " + narrowed.join(" and ") + " filter" + (narrowed.length > 1 ? "s" : "") + " you have set."
          : filter === "all" ? "Every comment has been closed."
                             : "No threads match this filter.") + "</div>";
      return;
    }

    var groups = [], byKey = {};
    shown.forEach(function (it) {
      var k = sheetKey(it);
      if (!byKey[k]) { byKey[k] = { first: it, items: [] }; groups.push(byKey[k]); }
      byKey[k].items.push(it);
      if (!byKey[k].first.appName && it.appName) byKey[k].first = it;
    });

    var anyOpen = groups.some(function (g) { return !collapsed[sheetKey(g.first)]; });
    $("collapseAll").textContent = anyOpen ? "collapse all" : "expand all";

    $list.innerHTML = groups.map(function (g) {
      var it = g.first, url = qlikUrl(it), key = sheetKey(it);
      var shut = !!collapsed[key];
      // The count rides the header so a folded group never looks like an empty one.
      return '<div class="group-head' + (shut ? " collapsed" : "") + '" data-group="' + esc(key) + '">' +
               '<span class="grp-caret">▼</span>' +
               "<span>" + esc(appLabel(it)) + "</span>" +
               '<span class="sheet">› ' + esc(sheetLabel(it)) + "</span>" +
               '<span class="grp-count">' + g.items.length + "</span>" +
               (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">open in Qlik ↗</a>' : "") +
             "</div>" +
             (shut ? "" : g.items.map(one).join(""));
    }).join("");
  }

  // ---- people & roles -----------------------------------------------------
  // There is no login here: the API trusts the name it is given, so "who am I" is
  // typed rather than proven. That makes this a permission model - it decides what
  // the interface offers - and not a security boundary. Said plainly in the panel
  // too, because a roles screen that looks like access control while being advisory
  // is worse than one that admits it.

  var ROLES = [
    { v: "admin", label: "Admin", hint: "sees everything, may delete any comment and set roles" },
    { v: "team",  label: "Team",  hint: "sees every thread and gets the notifications" },
    { v: "guest", label: "Guest", hint: "sees only the threads they started" }
  ];
  var people = [];
  var me = "";
  try { me = localStorage.getItem("qlikCollab.admin") || ""; } catch (e) { me = ""; }

  function myRole() {
    for (var i = 0; i < people.length; i++) {
      if (people[i].username.toLowerCase() === me.toLowerCase()) return people[i].role;
    }
    return "guest";
  }

  function loadPeople() {
    return fetch("/api/users")
      .then(function (r) { return r.json(); })
      .then(function (list) { people = list || []; renderPeople(); })
      .catch(function () { showError("Could not load the people list."); });
  }

  function renderPeople() {
    var $p = $("people");
    var amAdmin = myRole() === "admin";

    var rows = people.map(function (u) {
      var opts = ROLES.map(function (r) {
        return '<option value="' + r.v + '"' + (u.role === r.v ? " selected" : "") + ">" +
               esc(r.label) + "</option>";
      }).join("");
      var wrote = [];
      if (u.threads) wrote.push(u.threads + (u.threads === 1 ? " thread" : " threads"));
      if (u.replies) wrote.push(u.replies + (u.replies === 1 ? " reply" : " replies"));
      if (!wrote.length) wrote.push("has not written yet");
      if (u.lastSeen) wrote.push(fmtTime(u.lastSeen));

      return '<div class="person">' +
          '<div class="person-main">' +
            '<div class="person-name" title="' + esc(u.username) +
              (u.userDirectory ? " (" + esc(u.userDirectory) + ")" : "") + '">' +
              esc(u.username) + "</div>" +
            '<div class="person-sub">' + esc(wrote.join(" · ")) + "</div>" +
          "</div>" +
          '<select class="role-pick role-' + esc(u.role) + '" data-user="' + esc(u.username) + '"' +
            (amAdmin ? "" : " disabled") + ">" + opts + "</select>" +
        "</div>";
    }).join("");

    $p.innerHTML =
      '<div class="who-am-i">You are' +
        '<input id="whoami" value="' + esc(me) + '" placeholder="your username" autocomplete="off"/>' +
        "<div style=\"margin-top:5px\">" + (me
          ? (amAdmin ? "<b>Admin</b> — you can change roles and delete any comment."
                     : "<b>" + esc(myRole()) + "</b> — only an admin can change roles.")
          : "Type your username to act as yourself.") + "</div>" +
      "</div>" +
      (rows || '<div class="person-sub">Nobody has opened the panel yet.</div>') +
      '<div class="note">' +
        ROLES.map(function (r) { return "<b>" + esc(r.label) + "</b> — " + esc(r.hint); }).join("<br/>") +
        "<br/><br/>This decides what the interface offers. It is not a login: the API " +
        "trusts the name it is sent, so it keeps people out of each other's way rather " +
        "than keeping anyone out." +
      "</div>";
  }

  // Hiding it gives the whole width to the queue; the way back is in the header, so a
  // hidden sidebar is never a hidden feature.
  function setSide(open) {
    $("wrap").classList.toggle("no-side", !open);
    $("showSide").style.display = open ? "none" : "";
    try { localStorage.setItem("qlikCollab.side", open ? "1" : "0"); } catch (e) { /* noop */ }
    if (open) loadPeople();
  }
  $("collapseSide").addEventListener("click", function () { setSide(false); });
  $("showSide").addEventListener("click", function () { setSide(true); });
  try { setSide(localStorage.getItem("qlikCollab.side") !== "0"); }
  catch (e) { setSide(true); }

  $("people").addEventListener("change", function (e) {
    var sel = e.target.closest(".role-pick");
    if (sel) {
      var user = sel.getAttribute("data-user");
      fetch("/api/users/" + encodeURIComponent(user) + "/role", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role: sel.value, by: me })
      }).then(function (r) {
        if (r.ok) return loadPeople();
        return r.json().then(function (b) { throw new Error((b && b.error) || "server said " + r.status); });
      }).catch(function (err) {
        showError("Could not change the role: " + (err && err.message));
        loadPeople();                      // put the dropdown back to the truth
      });
      return;
    }
    if (e.target.id === "whoami") {
      me = e.target.value.trim();
      try { localStorage.setItem("qlikCollab.admin", me); } catch (e2) { /* private mode */ }
      renderPeople();
      render();     // who you are decides whether the queue offers delete at all
    }
  });

  // ---- data ---------------------------------------------------------------
  function load() {
    fetch("/api/inbox?includeClosed=" + (filter === "closed"))
      .then(function (r) { if (!r.ok) throw new Error("server answered " + r.status); return r.json(); })
      .then(function (data) {
        clearError();
        var payload = JSON.stringify(data);
        if (payload === lastPayload) return;    // never redraw an expanded thread away
        lastPayload = payload;
        items = data;
        render();
      })
      .catch(function (err) {
        showError("Cannot load the inbox: " + (err && err.message) + ". Is the backend running?");
      });
  }

  // ---- events -------------------------------------------------------------
  function applyStatusFilter(f) {
    filter = f;
    Array.prototype.forEach.call($("filters").querySelectorAll("button[data-f]"), function (b) {
      b.classList.toggle("on", b.getAttribute("data-f") === f);
    });
    lastPayload = "";          // "include closed" changes the query itself
    load();
  }

  $("filters").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-f]");
    if (btn) applyStatusFilter(btn.getAttribute("data-f"));
  });
  $kpis.addEventListener("click", function (e) {
    var tile = e.target.closest(".tile[data-f]");
    if (tile) applyStatusFilter(tile.getAttribute("data-f"));
  });

  // One control, both ways: it reads "expand all" once everything is folded.
  $("collapseAll").addEventListener("click", function () {
    var heads = $list.querySelectorAll(".group-head");
    var anyOpen = Array.prototype.some.call(heads, function (h) {
      return !collapsed[h.getAttribute("data-group")];
    });
    Array.prototype.forEach.call(heads, function (h) {
      var k = h.getAttribute("data-group");
      if (anyOpen) collapsed[k] = true; else delete collapsed[k];
    });
    saveCollapsed();
    render();
  });

  function onFilterChange() {
    fUser = cUser.value;
    fApp = cApp.value;
    // a sheet chosen under a different app is meaningless once the app changes
    fSheet = (fApp && cSheet.value.indexOf(fApp + "|") !== 0) ? "" : cSheet.value;
    render();
  }
  var cUser = Combo("cUser", "All people", onFilterChange);
  var cApp = Combo("cApp", "All apps", onFilterChange);
  var cSheet = Combo("cSheet", "All sheets", onFilterChange);
  $fClear.addEventListener("click", function () {
    fUser = fApp = fSheet = "";
    cUser.clear(); cApp.clear(); cSheet.clear();
    render();
  });

  // per-segment hover: an HTML chart is interactive, so the mix is readable
  // without counting pixels
  document.addEventListener("mousemove", function (e) {
    var seg = e.target.closest ? e.target.closest("[data-tip]") : null;
    if (!seg) { $tip.style.display = "none"; return; }
    $tip.textContent = seg.getAttribute("data-tip");
    $tip.style.display = "block";
    var pad = 12;
    $tip.style.left = Math.min(e.clientX + pad, window.innerWidth - $tip.offsetWidth - 6) + "px";
    $tip.style.top = Math.max(6, e.clientY - $tip.offsetHeight - 8) + "px";
  });

  $list.addEventListener("click", function (e) {
    // the "open in Qlik" link lives in the header and must not fold it
    var head = e.target.closest(".group-head");
    if (head && !e.target.closest("a")) {
      var key = head.getAttribute("data-group");
      if (collapsed[key]) delete collapsed[key]; else collapsed[key] = true;
      saveCollapsed();
      render();
      return;
    }

    var chip = e.target.closest("button.chip");
    if (chip) {
      var next = ORDER[(ORDER.indexOf(chip.getAttribute("data-status")) + 1) % ORDER.length];
      fetch("/api/comments/" + chip.getAttribute("data-id") + "/status", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: next })
      }).then(function (r) {
        if (!r.ok) throw new Error("server answered " + r.status);
        lastPayload = ""; load();
      }).catch(function (err) { showError("Could not change the status: " + (err && err.message)); });
      return;
    }
    var del = e.target.closest("button[data-del]");
    if (del) {
      // Two clicks, not a modal. It is a soft delete, but nothing in the interface
      // brings it back, so one stray click should not be enough.
      if (!del.classList.contains("armed")) {
        del.classList.add("armed");
        del.textContent = "delete?";
        clearTimeout(window.__delTimer);
        window.__delTimer = setTimeout(function () {
          del.classList.remove("armed");
          del.textContent = "delete";
        }, 3000);
        return;
      }
      fetch("/api/comments/" + del.getAttribute("data-del") + "?author=" + encodeURIComponent(me),
            { method: "DELETE" })
        .then(function (r) {
          if (!r.ok) throw new Error("server answered " + r.status);
          lastPayload = ""; load();
        })
        .catch(function (err) { showError("Could not delete: " + (err && err.message)); });
      return;
    }

    var toggle = e.target.closest("button[data-toggle]");
    if (toggle) {
      var id = toggle.getAttribute("data-toggle");
      if (Object.prototype.hasOwnProperty.call(expanded, id)) { delete expanded[id]; render(); return; }
      fetch("/api/inbox/" + id + "/replies")
        .then(function (r) { return r.json(); })
        .then(function (rs) { expanded[id] = rs || []; render(); })
        .catch(function () { showError("Could not load the replies."); });
    }
  });

  // theme: remembered, and it must beat the OS setting in both directions
  var $theme = $("theme");
  try {
    var saved = localStorage.getItem("qlikCollab.theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  } catch (e) { /* private mode */ }
  $theme.addEventListener("click", function () {
    var dark = document.documentElement.getAttribute("data-theme") === "dark" ||
               (!document.documentElement.getAttribute("data-theme") &&
                window.matchMedia("(prefers-color-scheme: dark)").matches);
    var next = dark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("qlikCollab.theme", next); } catch (e) { /* noop */ }
    render();      // segment colours are read from CSS vars
  });

  // ---- live ---------------------------------------------------------------
  var timer = null;
  function setPoll(ms) { if (timer) clearInterval(timer); timer = setInterval(load, ms); }

  function connect() {
    if (typeof signalR === "undefined") { $conn.textContent = "polling"; return; }
    try {
      var conn = new signalR.HubConnectionBuilder()
        .withUrl("/hubs/comments").withAutomaticReconnect().build();
      conn.on("commentsChanged", load);
      conn.onreconnected(function () { $conn.className = "conn live"; $conn.textContent = "live"; load(); });
      conn.onclose(function () { $conn.className = "conn down"; $conn.textContent = "reconnecting…"; setPoll(10000); });
      conn.start().then(function () {
        $conn.className = "conn live"; $conn.textContent = "live"; setPoll(60000);
      }).catch(function () { $conn.className = "conn"; $conn.textContent = "polling"; });
    } catch (e) { $conn.className = "conn"; $conn.textContent = "polling"; }
  }

  // The Qlik host differs per deployment; ask before first render or every
  // "open the sheet" link points at the wrong machine.
  fetch("/api/config")
    .then(function (r) { return r.json(); })
    .then(function (c) { qlikBaseUrl = (c && c.qlikBaseUrl) || ""; })
    .catch(function () { /* links are simply omitted */ })
    .then(loadPeople)          // myRole() decides whether delete is offered
    .then(function () { load(); setPoll(10000); connect(); });
})();
</script>
</body>
</html>
